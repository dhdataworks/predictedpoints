name: Refresh FPL data

on:
  push:
    branches: [main]
  schedule:
    # 06:15 UTC daily — after overnight price changes have settled.
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest player and fixture data
        run: python fetch_fpl_data.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players.json teams.json fixtures.json
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "Refresh FPL data ($(date -u +%Y-%m-%d))"
            git push
          fi
